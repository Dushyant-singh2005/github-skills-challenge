name: Step 0

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  start_exercise:
    name: Validate exercise setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm project files
        run: |
          test -f requirements.txt
          test -d src
          test -d tests
          echo "Exercise setup is ready"
