name: Step 4

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  final_review:
    name: Final project review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm CI workflows exist
        run: |
          test -f .github/workflows/python-package.yml
          test -f .github/workflows/python-coverage.yml
