name: Step 2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/python-package.yml
      - .github/workflows/python-coverage.yml

permissions:
  contents: read

jobs:
  check_workflows:
    name: Check CI workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python test workflow
        run: grep -q pytest .github/workflows/python-package.yml

      - name: Check Python coverage workflow
        run: grep -q -- '--cov=src' .github/workflows/python-coverage.yml
